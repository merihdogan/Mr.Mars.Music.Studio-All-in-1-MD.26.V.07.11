<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141a">
<meta name="referrer" content="no-referrer">
<title>Mr. Mars Music Studio</title>
<style>
  :root { color-scheme: dark; --bg: #141414; --card: #1f1f1f; --fg: #ececec; --mut: #9a9a9a; --acc: #eeeeee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; padding-bottom: 40px; }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 19px; margin: 4px 0; color: var(--acc); text-align: center; }
  .card { background: var(--card); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .muted { color: var(--mut); font-size: 14px; }
  .bar { height: 8px; background: #0b0f14; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--acc); }
  button, a.btn { font: inherit; background: #2a3440; color: var(--fg); border: 0; border-radius: 8px; padding: 12px; text-align: center; text-decoration: none; display: block; width: 100%; }
  .primary { background: var(--acc) !important; color: #06201d !important; font-weight: 600; }
  audio, video { width: 100%; border-radius: 8px; background: #000; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .name { font-weight: 600; word-break: break-word; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Mr. Mars Music Studio</h1>
  <div class="card" id="pairing">
    <div id="msg"></div>
    <div id="fmt" class="row" hidden></div>
  </div>
  <div class="card" id="progress" hidden>
    <div id="pname" class="name"></div>
    <div class="bar"><i id="pbar"></i></div>
    <div id="ptext" class="muted"></div>
  </div>
  <div id="files"></div>
</main>
<script src="mrmars-cekirdek/telefon-baglanti.js"></script>
<script>
(function () {
  // [tr, en, de, es, fr, sv, ru]
  const T = {
    open: ['Bu sayfayı bilgisayardaki Telefona Gönder penceresinin QR koduyla açın.', 'Open this page with the QR code in the Send to Phone window on your computer.', 'Öffnen Sie diese Seite mit dem QR-Code im Fenster „An Telefon senden“ am Computer.', 'Abra esta página con el código QR de la ventana Enviar al teléfono del ordenador.', 'Ouvrez cette page avec le code QR de la fenêtre Envoyer au téléphone de l’ordinateur.', 'Öppna sidan med QR-koden i fönstret Skicka till telefon på datorn.', 'Откройте эту страницу через QR-код в окне «Отправить на телефон» на компьютере.'],
    old: ['Bilgisayardaki program eski sürüm. Bilgisayarda Ctrl+F5 ile yenileyin (Mac: Cmd+Shift+R), sonra yeni QR kodu okutun.', 'The program on the computer is an older version. Refresh it with Ctrl+F5 (Mac: Cmd+Shift+R), then scan the new QR code.', 'Das Programm auf dem Computer ist veraltet. Mit Strg+F5 aktualisieren (Mac: Cmd+Shift+R), dann den neuen QR-Code scannen.', 'El programa del ordenador es una versión antigua. Actualice con Ctrl+F5 (Mac: Cmd+Shift+R) y escanee el nuevo código QR.', 'Le programme sur l’ordinateur est une ancienne version. Actualisez avec Ctrl+F5 (Mac : Cmd+Shift+R), puis scannez le nouveau code QR.', 'Programmet på datorn är en äldre version. Uppdatera med Ctrl+F5 (Mac: Cmd+Shift+R) och skanna den nya QR-koden.', 'На компьютере старая версия программы. Обновите её: Ctrl+F5 (Mac: Cmd+Shift+R), затем отсканируйте новый QR-код.'],
    get: ['Al', 'Get', 'Holen', 'Obtener', 'Recevoir', 'Hämta', 'Получить'],
    got: ['Müzik geldi. Kaydet ile telefona alın.', 'The music has arrived. Press Save to keep it on your phone.', 'Die Musik ist da. Mit Speichern auf dem Telefon sichern.', 'La música ha llegado. Pulse Guardar para conservarla.', 'La musique est arrivée. Appuyez sur Enregistrer pour la garder.', 'Musiken har kommit. Tryck på Spara för att behålla den.', 'Музыка получена. Нажмите «Сохранить», чтобы оставить её на телефоне.'],
    prep: ['Bağlantı hazırlanıyor…', 'Preparing the connection…', 'Verbindung wird vorbereitet…', 'Preparando la conexión…', 'Préparation de la connexion…', 'Förbereder anslutningen…', 'Подготовка подключения…'],
    more: ['Başka biçimde al:', 'Get it in another format:', 'In anderem Format holen:', 'Obtener en otro formato:', 'Recevoir dans un autre format :', 'Hämta i annat format:', 'Получить в другом формате:'],
    relay: ['Bağlantı servislerine ulaşılamıyor. İnternet bağlantısını kontrol edin.', 'Cannot reach the connection services. Check your internet connection.', 'Verbindungsdienste nicht erreichbar. Prüfen Sie die Internetverbindung.', 'No se puede acceder a los servicios de conexión. Compruebe su Internet.', 'Services de connexion inaccessibles. Vérifiez votre connexion Internet.', 'Kan inte nå anslutningstjänsterna. Kontrollera internet.', 'Сервисы подключения недоступны. Проверьте интернет.'],
    pc: ['Bilgisayar yanıt vermedi. Telefona Gönder penceresi açık mı?', 'The computer did not answer. Is the Send to Phone window open?', 'Der Computer antwortet nicht. Ist das Fenster „An Telefon senden“ geöffnet?', 'El ordenador no responde. ¿Está abierta la ventana Enviar al teléfono?', 'L’ordinateur ne répond pas. La fenêtre Envoyer au téléphone est-elle ouverte ?', 'Datorn svarar inte. Är fönstret Skicka till telefon öppet?', 'Компьютер не отвечает. Открыто ли окно «Отправить на телефон»?'],
    conn: ['Bağlandı. Müzik bekleniyor…', 'Connected. Waiting for music…', 'Verbunden. Warte auf Musik…', 'Conectado. Esperando música…', 'Connecté. En attente de musique…', 'Ansluten. Väntar på musik…', 'Подключено. Ожидание музыки…'],
    fail: ['Doğrudan bağlantı kurulamadı. Telefonu bilgisayarla aynı Wi-Fi ağına alıp kodu yeniden okutun.', 'Could not connect directly. Put the phone on the same Wi-Fi as the computer and scan again.', 'Keine direkte Verbindung. Verbinden Sie das Telefon mit demselben WLAN und scannen Sie erneut.', 'No se pudo conectar directamente. Ponga el teléfono en la misma Wi-Fi y vuelva a escanear.', 'Connexion directe impossible. Mettez le téléphone sur le même Wi-Fi et scannez à nouveau.', 'Kunde inte ansluta direkt. Anslut telefonen till samma Wi-Fi och skanna igen.', 'Прямое подключение не удалось. Подключите телефон к той же сети Wi-Fi и отсканируйте снова.'],
    closed: ['Bağlantı kapandı. Aldığınız dosyalar bu sayfada duruyor.', 'Connection closed. Received files stay on this page.', 'Verbindung beendet. Empfangene Dateien bleiben auf dieser Seite.', 'Conexión cerrada. Los archivos recibidos siguen en esta página.', 'Connexion fermée. Les fichiers reçus restent sur cette page.', 'Anslutningen stängd. Mottagna filer finns kvar här.', 'Соединение закрыто. Полученные файлы остаются на этой странице.'],
    save: ['Kaydet', 'Save', 'Speichern', 'Guardar', 'Enregistrer', 'Spara', 'Сохранить'],
    share: ['Paylaş', 'Share', 'Teilen', 'Compartir', 'Partager', 'Dela', 'Поделиться'],
    badfile: ['Dosya bozuk geldi, yeniden gönderin.', 'The file arrived damaged. Send it again.', 'Die Datei ist beschädigt. Bitte erneut senden.', 'El archivo llegó dañado. Envíelo de nuevo.', 'Le fichier est arrivé endommagé. Renvoyez-le.', 'Filen kom fram skadad. Skicka igen.', 'Файл повреждён. Отправьте ещё раз.'],
    badcode: ['Kod geçersiz. Bilgisayarda yeni kod alın.', 'Invalid code. Get a new code on the computer.', 'Ungültiger Code. Neuen Code am Computer holen.', 'Código no válido. Genere uno nuevo en el ordenador.', 'Code invalide. Générez-en un nouveau.', 'Ogiltig kod. Hämta en ny på datorn.', 'Неверный код. Получите новый на компьютере.'],
    leave: ['Telefon ekranını açık tutun ve bu sayfadan çıkmayın.', 'Keep the screen on and stay on this page.', 'Lassen Sie den Bildschirm an und bleiben Sie auf dieser Seite.', 'Mantenga la pantalla encendida y permanezca en esta página.', 'Gardez l’écran allumé et restez sur cette page.', 'Håll skärmen tänd och stanna på sidan.', 'Не выключайте экран и не покидайте страницу.'],
  };
  const LANGS = ['tr', 'en', 'de', 'es', 'fr', 'sv', 'ru'];
  const li = Math.max(0, LANGS.indexOf((navigator.language || 'en').slice(0, 2).toLowerCase()) < 0 ? 1 : LANGS.indexOf((navigator.language || 'en').slice(0, 2).toLowerCase()));
  document.documentElement.lang = LANGS[li];
  const t = k => T[k][li], $ = id => document.getElementById(id);
  const msg = s => { $('msg').textContent = s; };
  const mb = n => (n / 1048576).toFixed(1) + ' MB';

  function addFile(blob, meta) {
    const url = URL.createObjectURL(blob), isVid = /^video/.test(meta.type), player = document.createElement(isVid ? 'video' : 'audio');
    player.controls = true; player.src = url; player.playsInline = true; player.preload = 'metadata';
    const card = document.createElement('div'); card.className = 'card'; card.style.marginBottom = '12px';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = meta.name;
    const size = document.createElement('div'); size.className = 'muted'; size.textContent = mb(meta.size);
    const row = document.createElement('div'); row.className = 'row';
    const save = document.createElement('a'); save.className = 'btn primary'; save.href = url; save.download = meta.name; save.textContent = t('save'); row.appendChild(save);
    const file = new File([blob], meta.name, { type: meta.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { const sh = document.createElement('button'); sh.textContent = t('share'); sh.onclick = () => navigator.share({ files: [file] }).catch(() => { }); row.appendChild(sh); }
    card.append(name, player, size, row); $('files').prepend(card);
    window.__received = window.__received || []; window.__received.push({ name: meta.name, size: meta.size, type: meta.type, blob });
  }

  const formats = (dc, list) => {
    const box = $('fmt'); box.innerHTML = ''; box.hidden = false; box.style.flexWrap = 'wrap';
    const lab = document.createElement('div'); lab.className = 'muted'; lab.textContent = t('more'); lab.style.flex = '0 0 100%'; box.appendChild(lab);
    const sel = document.createElement('select'); sel.id = 'fmtsel'; sel.style.cssText = 'flex:2 1 60%;font:inherit;background:#2a3440;color:var(--fg);border:0;border-radius:8px;padding:12px;min-width:0';
    const groups = {}; list.forEach(f => { let g = groups[f.group]; if (!g) { g = groups[f.group] = document.createElement('optgroup'); g.label = f.group; sel.appendChild(g); } const o = document.createElement('option'); o.value = f.id; o.textContent = f.label; g.appendChild(o); });
    const go = document.createElement('button'); go.id = 'fmtgo'; go.className = 'primary'; go.textContent = t('get'); go.style.flex = '1 1 25%';
    go.onclick = () => { try { dc.send(JSON.stringify({ kind: 'request', format: sel.value })); } catch (e) { } };
    box.append(sel, go);
  };
  async function start() {
    const m = /[#&]r=([^&]+)&k=([^&]+)/.exec(location.hash);
    if (/[#&]o=/.test(location.hash)) { msg(t('old')); return; } // Bilgisayardaki pencere eski sürüm
    if (!m) { msg(t('open')); return; }
    history.replaceState(null, '', location.pathname); // Anahtar adres geçmişinde kalmasın
    msg(t('prep'));
    const me = 'ph' + OSLink.rand(6);
    let answered = false, relayUp = false, hello, relay;
    const noPc = setTimeout(() => { if (!answered) msg(relayUp ? t('pc') : t('relay')); }, 25000);
    relay = await OSLink.relay(m[1], m[2], me, async x => {
      if (x.t !== 'offer' || answered) return;
      answered = true; clearInterval(hello); clearTimeout(noPc);
      const link = await OSLink.createAnswer(x.desc), pc = link.pc;
      window.__answered = true;
      const failT = setTimeout(() => { if (pc.connectionState !== 'connected') msg(t('fail')); }, 30000);
      pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') msg(t('fail')); };
      pc.ondatachannel = ({ channel: dc }) => {
        const opened = () => { clearTimeout(failT); msg(t('conn')); window.__state = 'open'; relay.close(); };
        dc.readyState === 'open' ? opened() : dc.addEventListener('open', opened);
        dc.addEventListener('close', () => { $('progress').hidden = true; $('fmt').hidden = true; msg(t('closed')); });
        window.__dc = dc;
        OSLink.receiver(dc, {
          formats: l => formats(dc, l),
          status: s => { $('progress').hidden = false; $('pname').textContent = ''; $('ptext').textContent = s.text; $('pbar').style.width = '0'; },
          start: f => { $('progress').hidden = false; $('pname').textContent = f.name; $('ptext').textContent = mb(f.size) + ' · ' + t('leave'); },
          progress: k => { $('pbar').style.width = Math.round(k * 100) + '%'; },
          done: (blob, meta) => { $('progress').hidden = true; msg(t('got')); addFile(blob, meta); },
          error: () => { $('progress').hidden = true; msg(t('badfile')); window.__state = 'badfile'; },
          remoteError: e => { $('progress').hidden = true; msg(e.text); },
        });
      };
      relay.send({ t: 'answer', to: x.from, desc: link.desc });
    }, n => { relayUp = n > 0; if (n && !answered) relay && relay.send({ t: 'hello' }); });
    const send = () => relay.send({ t: 'hello' });
    send(); hello = setInterval(send, 2000);
    setTimeout(() => clearInterval(hello), 60000);
  }
  start();
})();
</script>
</body>
</html>
